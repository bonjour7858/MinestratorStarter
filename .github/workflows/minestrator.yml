name: Check Minestrator Commands

on:
  workflow_dispatch:

jobs:
  run-command:
    runs-on: ubuntu-latest
    steps:
      - name: Debug Secrets and Connection
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MINESTRATOR_TOKEN: ${{ secrets.MINESTRATOR_TOKEN }}
          SERVER_ID: ${{ secrets.SERVER_ID }}
        run: |
          echo "=== VÉRIFICATION DES VARIABLES ==="
          echo "SUPABASE_URL vaut : '$SUPABASE_URL'"
          echo "SERVER_ID vaut    : '$SERVER_ID'"

          if [ -z "$SUPABASE_URL" ]; then
            echo "ERREUR : SUPABASE_URL est vide !"
            exit 1
          fi

          echo "=== TEST DE CONNEXION SUPABASE ==="
          curl -v "${SUPABASE_URL}/rest/v1/server_commands?select=count" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}"
