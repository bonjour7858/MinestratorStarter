name: Check Minestrator Commands

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-command:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and Execute Pending Commands
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MINESTRATOR_TOKEN: ${{ secrets.MINESTRATOR_TOKEN }}
          SERVER_ID: ${{ secrets.SERVER_ID }}
        run: |
          # 1. Lecture de la commande Supabase
          RESPONSE=$(curl -s -S "${SUPABASE_URL}/rest/v1/server_commands?status=eq.pending&order=created_at.asc&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")

          echo "Réponse Supabase : $RESPONSE"

          COMMAND_ID=$(echo "$RESPONSE" | jq -r '.[0].id // empty')
          ACTION=$(echo "$RESPONSE" | jq -r '.[0].action // empty')

          if [ -z "$COMMAND_ID" ] || [ "$COMMAND_ID" = "null" ]; then
            echo "Aucune commande en attente."
            exit 0
          fi

          echo "Commande trouvée : $ACTION (ID: $COMMAND_ID)"

          # 2. Appel à Minestrator avec affichage des erreurs
          echo "Envoi à Minestrator pour le serveur ID: '$SERVER_ID'..."
          
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://api.minestrator.com/v1/server/${SERVER_ID}/action/${ACTION}" \
            -H "Authorization: Bearer ${MINESTRATOR_TOKEN}" || echo "CURL_ERROR")

          echo "Code HTTP Minestrator : $HTTP_CODE"

          # 3. Mise à jour du statut dans Supabase
          curl -s -X PATCH "${SUPABASE_URL}/rest/v1/server_commands?id=eq.${COMMAND_ID}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"status": "completed"}'
