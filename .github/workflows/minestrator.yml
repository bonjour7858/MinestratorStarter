name: Check Minestrator Commands

on:
  workflow_dispatch:

jobs:
  run-command:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and Execute Pending Commands
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MINESTRATOR_TOKEN: ${{ secrets.MINESTRATOR_TOKEN }}
          SERVER_ID: ${{ secrets.SERVER_ID }}
        run: |
          echo "--- ETAPE 1 : RECUPERATION SUPABASE ---"
          # Nettoyage strict des variables dans le shell
          S_URL=$(echo "${SUPABASE_URL}" | tr -d '\r\n')
          S_KEY=$(echo "${SUPABASE_SERVICE_ROLE_KEY}" | tr -d '\r\n')
          M_TOKEN=$(echo "${MINESTRATOR_TOKEN}" | tr -d '\r\n')
          M_ID=$(echo "${SERVER_ID}" | tr -d '\r\n')

          RESPONSE=$(curl -s "${S_URL}/rest/v1/server_commands?status=eq.pending&order=created_at.asc&limit=1" \
            -H "apikey: ${S_KEY}" \
            -H "Authorization: Bearer ${S_KEY}") || echo "ERREUR_CURL_SUPABASE"

          echo "Réponse : $RESPONSE"

          COMMAND_ID=$(echo "$RESPONSE" | jq -r '.[0].id // empty' 2>/dev/null)
          ACTION=$(echo "$RESPONSE" | jq -r '.[0].action // empty' 2>/dev/null)

          if [ -z "$COMMAND_ID" ] || [ "$COMMAND_ID" = "null" ]; then
            echo "Aucune commande en attente."
            exit 0
          fi

          echo "--- ETAPE 2 : ENVOI MINESTRATOR ---"
          echo "Action: $ACTION | Server ID: $M_ID"

          curl -i -X POST "https://api.minestrator.com/v1/server/${M_ID}/action/${ACTION}" \
            -H "Authorization: Bearer ${M_TOKEN}" || echo "ERREUR_CURL_MINESTRATOR"

          echo "--- ETAPE 3 : MISE A JOUR SUPABASE ---"
          curl -s -X PATCH "${S_URL}/rest/v1/server_commands?id=eq.${COMMAND_ID}" \
            -H "apikey: ${S_KEY}" \
            -H "Authorization: Bearer ${S_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"status": "completed"}'
