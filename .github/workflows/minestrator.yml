run: |
          # Nettoyage de l'URL Supabase au cas où il y a un slash en trop à la fin
          CLEAN_SUPABASE_URL=$(echo "${SUPABASE_URL}" | sed 's/*$//')

          RESPONSE=$(curl -s "${CLEAN_SUPABASE_URL}/rest/v1/server_commands?status=eq.pending&order=created_at.asc&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")

          echo "Commandes trouvées : $RESPONSE"

          COMMAND_ID=$(echo $RESPONSE | jq -r '.[0].id // empty')
          ACTION=$(echo $RESPONSE | jq -r '.[0].action // empty')

          if [ -z "$COMMAND_ID" ] || [ "null" = "$COMMAND_ID" ]; then
            echo "Aucune commande en attente."
            exit 0
          fi

          echo "Exécution de l'action : $ACTION pour la commande ID: $COMMAND_ID"

          # Appel API Minestrator v1
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://api.minestrator.com/v1/server/${SERVER_ID}/action/${ACTION}" \
            -H "Authorization: Bearer ${MINESTRATOR_TOKEN}")

          echo "Réponse API Minestrator (Code HTTP): $HTTP_CODE"

          curl -s -X PATCH "${CLEAN_SUPABASE_URL}/rest/v1/server_commands?id=eq.${COMMAND_ID}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"status": "completed"}'
