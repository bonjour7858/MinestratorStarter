name: Check Minestrator Commands

on:
  schedule:
    # S'exécute automatiquement toutes les 5 minutes (tu peux changer la fréquence si tu veux)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Permet de le lancer manuellement depuis l'onglet Actions

jobs:
  run-command:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and Execute Pending Commands
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MINESTRATOR_TOKEN: ${{ secrets.MINESTRATOR_TOKEN }}
          SERVER_ID: ${{ secrets.SERVER_ID }}
        run: |
          # 1. Récupérer la commande en attente (pending) la plus récente depuis Supabase
          RESPONSE=$(curl -s "${SUPABASE_URL}/rest/v1/server_commands?status=eq.pending&order=created_at.asc&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")

          echo "Commandes trouvées : $RESPONSE"

          # Extraire l'ID et l'action (start/stop/restart)
          COMMAND_ID=$(echo $RESPONSE | jq -r '.[0].id // empty')
          ACTION=$(echo $RESPONSE | jq -r '.[0].action // empty')

          if [ -z "$COMMAND_ID" ] || [ "null" = "$COMMAND_ID" ]; then
            echo "Aucune commande en attente."
            exit 0
          fi

          echo "Exécution de l'action : $ACTION pour la commande ID: $COMMAND_ID"

          # 2. Appeler l'API Minestrator (Adapte l'URL selon l'API officielle de Minestrator si besoin)
          # Note: Remplace l'URL ci-dessous par l'endpoint exact de l'API Minestrator pour controler le serveur
          # (Exemple type d'appel API Minestrator pour démarrer/arrêter)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://api.minestrator.com/v1/servers/${SERVER_ID}/${ACTION}" \
            -H "Authorization: Bearer ${MINESTRATOR_TOKEN}")

          echo "Réponse API Minestrator (Code HTTP): $HTTP_CODE"

          # 3. Mettre à jour le statut dans Supabase pour dire que c'est fait
          curl -s -X PATCH "${SUPABASE_URL}/rest/v1/server_commands?id=eq.${COMMAND_ID}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"status": "completed"}'
