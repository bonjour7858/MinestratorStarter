<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Serveur Minecraft - Panel Admin</title>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: white; padding: 20px; }
    .card { background: #1e1e1e; max-width: 450px; margin: 40px auto; padding: 25px; border-radius: 8px; border: 1px solid #333; }
    input { width: 100%; padding: 10px; margin: 8px 0; background: #2a2a2a; color: white; border: 1px solid #444; border-radius: 4px; box-sizing: border-box; }
    button { padding: 10px 15px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin: 5px 2px; }
    .btn-green { background: #2e7d32; color: white; }
    .btn-red { background: #c62828; color: white; }
    .btn-orange { background: #f57c00; color: white; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Panneau Admin Minecraft</h2>

    <!-- Boîte de Connexion -->
    <div id="auth-box">
      <input type="email" id="email" placeholder="Email (ex: admin@tonsite.com)">
      <input type="password" id="password" placeholder="Mot de passe">
      <button class="btn-green" onclick="login()">Se connecter</button>
    </div>

    <!-- Interface d'Administration -->
    <div id="admin-panel" class="hidden">
      <p>Connecté : <b id="user-email"></b></p>
      <button class="btn-green" onclick="requestAction('start')">Démarrer</button>
      <button class="btn-red" onclick="requestAction('stop')">Arrêter</button>
      <button class="btn-orange" onclick="requestAction('restart')">Redémarrer</button>
      <br><br>
      <button style="background: #555; color: white;" onclick="logout()">Déconnexion</button>
    </div>

    <p id="status-msg"></p>
  </div>

 <!-- 1. Le SDK Supabase en premier -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 2. Ton script.js ensuite -->
  <script src="script.js"></script>
</body>
</body>
</html>
