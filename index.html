<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Serveur Minecraft - Panel Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: white; padding: 20px; }
    .card { background: #1e1e1e; max-width: 450px; margin: 40px auto; padding: 25px; border-radius: 8px; border: 1px solid #333; }
    input { width: 100%; padding: 10px; margin: 8px 0; background: #2a2a2a; color: white; border: 1px solid #444; border-radius: 4px; box-sizing: border-box; }
    button { padding: 10px 15px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin: 5px 2px; }
    .btn-green { background: #2e7d32; color: white; }
    .btn-red { background: #c62828; color: white; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Panneau Admin Minecraft</h2>

    <div id="auth-box">
      <input type="email" id="email" placeholder="Email Admin">
      <input type="password" id="password" placeholder="Mot de passe">
      <button class="btn-green" onclick="login()">Se connecter</button>
    </div>

    <div id="admin-panel" class="hidden">
      <p>Connecté : <b id="user-email"></b></p>
      <button class="btn-green" onclick="requestAction('start')">Démarrer</button>
      <button class="btn-red" onclick="requestAction('stop')">Arrêter</button>
      <button class="btn-red" style="background:#f57c00;" onclick="requestAction('restart')">Redémarrer</button>
    </div>

    <p id="status-msg"></p>
  </div>

  <script>
    const SUPABASE_URL = "https://bpvcdtuvwbliaqxxmodq.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_bBnDkvUYr1uX70YcCm9WjQ_lfO65iHt";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) alert(error.message);
      else {
        document.getElementById('auth-box').classList.add('hidden');
        document.getElementById('admin-panel').classList.remove('hidden');
        document.getElementById('user-email').textContent = data.user.email;
      }
    }

    async function requestAction(actionName) {
      const msg = document.getElementById('status-msg');
      msg.textContent = "Demande transmise, le serveur va s'exécuter...";

      const { error } = await supabase
        .from('server_commands')
        .insert([{ action: actionName }]);

      if (error) {
        msg.style.color = "red";
        msg.textContent = "Erreur : " + error.message;
      } else {
        msg.style.color = "green";
        msg.textContent = `Demande de "${actionName}" envoyée avec succès !`;
      }
    }
  </script>
</body>
</html>
